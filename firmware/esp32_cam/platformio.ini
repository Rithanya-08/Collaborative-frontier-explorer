; Robot B camera (ESP32-CAM AI Thinker, OV2640): MJPEG stream over WiFi. See HARDWARE_SETUP.md.
; Shares WiFi/MQTT settings with robot_b: fill in ../robot_b/include/secrets.h first.
[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
    -I../robot_b/include
    -DBOARD_HAS_PSRAM
lib_deps =
    knolleary/PubSubClient@2.8
