; Robot B (ESP32 DevKit): WiFi + MQTT body, brain runs on the laptop. See HARDWARE_SETUP.md.
; Copy include/secrets.example.h to include/secrets.h and fill it in before building.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1
